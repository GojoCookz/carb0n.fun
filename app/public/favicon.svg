<!--
  THE MARK, AS AN ICON.

  This file previously held a purple (#863bff) glyph from a starter template. It was never
  our logo, that colour appears nowhere else in the codebase, and it shipped in the first
  app commit and survived every redesign since - because nobody looks at a favicon.

  It is the same faceted octahedron as `src/components/Logo.tsx`: two bodies held apart at
  the waist, lit from opposite sides. The gap is the product - a token and the currency it
  is paired against - and value crossing it in both directions is the dividend.

  TWO DELIBERATE DEPARTURES FROM THE LOGO, both forced by size.

  1. THE GAP IS WIDER. In the logo the gap is 13% of the mark's height. A favicon renders at
     16px, where 13% of an 11px-tall mark is a pixel and a half - it closes up and the thing
     reads as Ethereum's own glyph, which is the exact failure the logo's own geometry note
     records fixing once already. Here it is 17%, which survives to about two pixels.

  2. IT SITS ON A DARK TILE. The mark is chrome - near-white at its highlight. Chrome on the
     white tab bar of a light-themed browser is invisible, and a transparent favicon is at
     the mercy of whatever is behind it. The tile fixes the contrast in both directions and
     costs nothing, since every surface in the app is near-black anyway (the ink-950 token is
     #050507 by default and #04070a on Robinhood).

  A NOTE ON THIS COMMENT. It cannot contain two consecutive hyphens - that is illegal in XML,
  and the icon rasteriser rejected an earlier draft that named the CSS custom properties
  directly. Browsers are lenient about it; the build tooling is not.

  Everything else - the facet gradients, the opposed lighting, the machined rim on the cut
  faces - is carried over unchanged, so the tab and the header read as the same object.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="carbonado.fun">
  <defs>
    <!-- Upper body takes the highlight. Same stops as LogoMark's `lit`. -->
    <linearGradient id="cf-lit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="55%" stop-color="#d5d7de" />
      <stop offset="100%" stop-color="#9a9caa" />
    </linearGradient>
    <!-- The shared mid tone, used on the right face of both bodies. -->
    <linearGradient id="cf-mid" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c9cbd3" />
      <stop offset="100%" stop-color="#7b7d8a" />
    </linearGradient>
    <!-- Lower body takes the shadow, so the eye reads two assets rather than one gem. -->
    <linearGradient id="cf-dark" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#4a4c57" />
      <stop offset="100%" stop-color="#8b8d99" />
    </linearGradient>
  </defs>

  <!-- The tile. Radius 14 of 64 is the iOS squircle ratio, so it looks intentional when a
       browser or an OS rounds it again on top. -->
  <rect width="64" height="64" rx="14" fill="#08090c" />
  <!-- A hairline lift so the tile has an edge against a black tab bar too. -->
  <rect x="0.5" y="0.5" width="63" height="63" rx="13.5" fill="none" stroke="#ffffff" stroke-opacity="0.08" />

  <!-- SIZING NOTE. The mark fills 84% of the tile, not the 72% of an earlier draft. That draft
       was checked by rasterising it to 16px and looking at it, which is the only way this is
       ever checked: at 72% the mark was about eleven pixels tall, the facets muddied into one
       grey mass and the gap closed. Padding that looks generous at 512px is wasted space at
       the size a favicon is actually seen. 84% still clears the iOS squircle mask, which
       trims corners rather than the centre column this shape occupies. -->

  <!-- UPPER BODY: apex at y=5, cut flat across the waist at y=29. Takes the highlight. -->
  <path d="M32 5 L14.5 26 L20.3 29 L32 29 Z" fill="url(#cf-lit)" />
  <path d="M32 5 L49.5 26 L43.7 29 L32 29 Z" fill="url(#cf-mid)" />

  <!-- THE GAP: y 29 down to 38. Nothing is drawn here, and that is the point. -->

  <!-- LOWER BODY: mirrored about the gap so the band is parallel, not a wedge. -->
  <path d="M32 59 L14.5 41 L20.3 38 L32 38 Z" fill="url(#cf-dark)" />
  <path d="M32 59 L49.5 41 L43.7 38 L32 38 Z" fill="url(#cf-mid)" opacity="0.62" />

  <!-- Rim of light on the cut faces, so the gap reads machined rather than broken. -->
  <path d="M20.3 29 L43.7 29" stroke="#ffffff" stroke-opacity="0.5" stroke-width="1" />
  <path d="M20.3 38 L43.7 38" stroke="#ffffff" stroke-opacity="0.18" stroke-width="0.8" />
</svg>
